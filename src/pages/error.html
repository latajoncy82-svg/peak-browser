<!DOCTYPE html>
<html lang="pl" data-theme="alpine-dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self' peak:; img-src 'self' peak: data:; style-src 'self' 'unsafe-inline' peak:; script-src 'self' 'unsafe-inline' peak:;"
  />
  <title>Nie można otworzyć strony</title>
  <style>
    :root, html[data-theme='alpine-dark'] {
      color-scheme: dark;
      --bg: #08101C;
      --panel: #101B2E;
      --border: rgba(148, 195, 255, 0.12);
      --text: #EBF2FC;
      --muted: #879CB8;
      --code-bg: #091220;
      --accent: #3898FF;
    }
    html[data-theme='alpine-light'], html[data-theme='alpine-royal'] {
      color-scheme: light;
      --bg: #F4F7FB;
      --panel: #FFFFFF;
      --border: rgba(22, 35, 54, 0.1);
      --text: #162336;
      --muted: #5C708B;
      --code-bg: #F1F5FA;
      --accent: #0B63E5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .panel {
      width: 100%;
      max-width: 440px;
      padding: 24px;
      border-radius: 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      width: 24px;
      height: 24px;
      border-radius: 6px;
    }
    h1 {
      font-size: 16px;
      font-weight: 600;
    }
    .sub {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
      word-break: break-word;
    }
    .code {
      font-size: 11.5px;
      color: var(--muted);
      background: var(--code-bg);
      padding: 7px 10px;
      border-radius: 6px;
    }
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    button {
      height: 32px;
      padding: 0 14px;
      border-radius: 7px;
      border: 1px solid var(--border);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
    }
    .primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #FFFFFF;
    }
    .secondary {
      background: transparent;
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="header">
      <img src="peak://assets/icon-64.png" alt="Peak" class="logo" />
      <h1>Nie można otworzyć tej strony</h1>
    </div>
    <p id="target-text" class="sub">Połączenie nie powiodło się. Sprawdź adres lub połączenie sieciowe.</p>
    <div id="code-text" class="code">Szczegóły: brak połączenia</div>
    <div class="actions">
      <button id="retry-btn" class="primary">Spróbuj ponownie</button>
      <button id="home-btn" class="secondary">Nowa karta</button>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const targetUrl = params.get('url') || '';
    const code = params.get('code') || '';
    const desc = params.get('desc') || '';

    if (targetUrl) {
      document.getElementById('target-text').textContent =
        'Nie udało się połączyć z adresem: ' + targetUrl;
    }
    document.getElementById('code-text').textContent =
      'Szczegóły: ' + (desc || 'Błąd sieci') + (code ? ' (' + code + ')' : '');

    document.getElementById('retry-btn').addEventListener('click', () => {
      if (window.peakNewTab && targetUrl) {
        window.peakNewTab.navigate(targetUrl);
      } else {
        window.location.reload();
      }
    });
    document.getElementById('home-btn').addEventListener('click', () => {
      if (window.peakNewTab) {
        window.peakNewTab.navigate('peak://newtab');
      }
    });

    if (window.peakNewTab) {
      window.peakNewTab.getInitialData().then((data) => {
        if (data && data.settings && data.settings.theme) {
          document.documentElement.dataset.theme = data.settings.theme;
        }
      }).catch(() => {});
      window.peakNewTab.onStateUpdate((data) => {
        if (data && data.settings && data.settings.theme) {
          document.documentElement.dataset.theme = data.settings.theme;
        }
      });
    }
  </script>
</body>
</html>
