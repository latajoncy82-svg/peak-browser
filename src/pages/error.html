<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self' peak:; img-src 'self' peak: data:; style-src 'self' 'unsafe-inline' peak:; script-src 'self' 'unsafe-inline' peak:;"
  />
  <title>Nie można otworzyć strony</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
      background: #F4F7FB;
      color: #162336;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .panel {
      width: 100%;
      max-width: 440px;
      padding: 24px;
      border-radius: 12px;
      background: #FFFFFF;
      border: 1px solid rgba(22, 35, 54, 0.1);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo {
      width: 24px;
      height: 24px;
      border-radius: 6px;
    }
    h1 {
      font-size: 16px;
      font-weight: 600;
    }
    .sub {
      font-size: 13px;
      color: #5C708B;
      line-height: 1.5;
      word-break: break-word;
    }
    .code {
      font-size: 11.5px;
      color: #5C708B;
      background: #F1F5FA;
      padding: 7px 10px;
      border-radius: 6px;
    }
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    button {
      height: 32px;
      padding: 0 14px;
      border-radius: 7px;
      border: 1px solid rgba(22, 35, 54, 0.12);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
    }
    .primary {
      border-color: #0B63E5;
      background: #0B63E5;
      color: #FFFFFF;
    }
    .secondary {
      background: transparent;
      color: #162336;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="header">
      <img src="peak://assets/icon-64.png" alt="Peak" class="logo" />
      <h1>Nie można otworzyć tej strony</h1>
    </div>
    <p id="target-text" class="sub">Połączenie nie powiodło się. Sprawdź adres lub połączenie sieciowe.</p>
    <div id="code-text" class="code">Szczegóły: brak połączenia</div>
    <div class="actions">
      <button id="retry-btn" class="primary">Spróbuj ponownie</button>
      <button id="home-btn" class="secondary">Nowa karta</button>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const targetUrl = params.get('url') || '';
    const code = params.get('code') || '';
    const desc = params.get('desc') || '';

    if (targetUrl) {
      document.getElementById('target-text').textContent =
        'Nie udało się połączyć z adresem: ' + targetUrl;
    }
    document.getElementById('code-text').textContent =
      'Szczegóły: ' + (desc || 'Błąd sieci') + (code ? ' (' + code + ')' : '');

    document.getElementById('retry-btn').addEventListener('click', () => {
      if (window.peakNewTab && targetUrl) {
        window.peakNewTab.navigate(targetUrl);
      } else {
        window.location.reload();
      }
    });
    document.getElementById('home-btn').addEventListener('click', () => {
      if (window.peakNewTab) {
        window.peakNewTab.navigate('peak://newtab');
      }
    });
  </script>
</body>
</html>
