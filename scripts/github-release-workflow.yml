name: Wydanie Peak Browser (Windows)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Konfiguruj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Zainstaluj zależności
        run: npm ci

      - name: Zbuduj instalator i wersję portable (.exe)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - name: Opublikuj wydanie na GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Peak-Browser-Setup-*.exe
            dist/Peak-Browser-Portable-*.exe
          generate_release_notes: true
